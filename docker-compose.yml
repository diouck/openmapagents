# OpenMapAgents — stack complet, déploiement en une commande.
#
#   git clone https://github.com/diouck/openmapagents.git
#   cd openmapagents
#   cp backend/.env.example backend/.env    # renseigne au moins une clé LLM
#   docker compose up -d
#
# Frontend exposé sur http://localhost:8080 (proxy /api -> backend).
# Postgres/pgvector et Redis tournent en conteneurs (données persistées en volumes).
# Les valeurs DB/Redis de backend/.env sont ignorées : le compose force la connexion
# aux services internes ci-dessous.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-openmapagents}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-openmapagents}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DB:-openmapagents}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/diouck/openmapagents-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      BACKEND_PORT: 8000
      # Surcharge la connexion vers les services internes (gagne sur backend/.env)
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DB: ${PG_DB:-openmapagents}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-openmapagents}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/openapi.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  frontend:
    image: ghcr.io/diouck/openmapagents-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    # Lit backend/.env pour injecter le token Mapbox au runtime (VITE_MAPBOX_TOKEN
    # ou MAPBOX_ACCESS_TOKEN) dans /env.js au demarrage. Seul le token est expose au
    # navigateur ; les autres variables restent dans l'environnement du conteneur.
    env_file:
      - backend/.env
    environment:
      BACKEND_UPSTREAM: http://backend:8000
    ports:
      # Ecoute uniquement en local : le nginx de l'hote (443, SSL) proxifie vers ce port.
      - "127.0.0.1:8090:80"

volumes:
  pgdata:
  redisdata:
